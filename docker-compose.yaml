# Embedded alerting stack owned by kontiki-monitor.
#
# Assembles: RabbitMQ + Registry + kontiki-monitor + Boomerang (subscription,
# alert-engine, email, telegram) + demo-app + MailHog.
#
# Boomerang runtime images install kontiki-boomerang from PyPI (no sibling checkout).
#
#   make stack-up

name: kontiki-monitor-embedded

x-boomerang-image: &boomerang-image
  build:
    context: .
    dockerfile: Dockerfile.boomerang
  image: kontiki-monitor-boomerang:local

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: km-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kontiki-registry:
    build:
      context: .
      dockerfile: Dockerfile.kontiki-registry
    image: kontiki-monitor-registry:local
    container_name: km-kontiki-registry
    command: >
      kontiki_registry --config /stack/common.docker.yaml --config /stack/kontiki_registry.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./logs:/logs
    restart: unless-stopped
    # PID 1 is kontiki_registry; start_period covers AMQP connect after rabbitmq-healthy.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; raise SystemExit(0 if b'kontiki_registry' in Path('/proc/1/cmdline').read_bytes() else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  mailhog:
    image: mailhog/mailhog
    container_name: km-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  subscription-service:
    <<: *boomerang-image
    container_name: km-subscription-service
    command: >
      boomerang-subscription
      --config /stack/common.services.yaml
      --config /stack/subscription.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/api/v1/docs\", timeout=2).read(); print(\"ok\")'"]
      interval: 5s
      timeout: 3s
      retries: 30

  email-notifier-service:
    <<: *boomerang-image
    container_name: km-email-notifier-service
    command: >
      boomerang-email-notifier
      --config /stack/common.services.yaml
      --config /stack/email_notifier.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    restart: unless-stopped
    # No HTTP surface (bus-only) — do not healthcheck /api/v1/docs.

  telegram-notifier-service:
    <<: *boomerang-image
    container_name: km-telegram-notifier-service
    command: >
      sh -c 'EXTRA=""; if [ -f /stack/telegram_notifier_bot_token.yaml ]; then EXTRA="--config /stack/telegram_notifier_bot_token.yaml"; fi;
      exec boomerang-telegram-notifier --config /stack/common.services.yaml --config /stack/telegram_notifier.yaml $$EXTRA'
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    restart: unless-stopped
    # No HTTP surface (bus-only). Same as email-notifier-service.

  alert-engine-service:
    <<: *boomerang-image
    container_name: km-alert-engine-service
    command: >
      boomerang-alert-engine
      --config /stack/common.services.yaml
      --config /stack/alert_engine.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      subscription-service:
        condition: service_started
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    restart: unless-stopped

  kontiki-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: kontiki-monitor:local
    container_name: kontiki-monitor
    command: >
      kontiki-monitor
      --config /stack/common.services.yaml
      --config /config/default.yaml
      --config /config/embedded.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      alert-engine-service:
        condition: service_started
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
      - ./config:/config:ro
    ports:
      - "8091:8091"
    restart: unless-stopped

  demo-app-service:
    <<: *boomerang-image
    container_name: km-demo-app-service
    command: >
      boomerang-demo-app
      --config /stack/common.services.yaml
      --config /stack/demo_app.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    restart: unless-stopped
