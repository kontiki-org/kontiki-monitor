logging:
  handlers:
    file:
      filename: /data/host_check_service.log

kontiki:
  registration:
    group: platform

host-check:
  # Stable alias for subscriptions / alert_id (not necessarily OS hostname).
  host: "local"
  category: "kontiki.host"
  poll_interval_seconds: 30
  warning_used_percent: 90
  critical_used_percent: 95
  paths:
    - /
