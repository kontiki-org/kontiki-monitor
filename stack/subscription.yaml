kontiki:
  http:
    address: "0.0.0.0"
    port: 8002
  registration:
    group: platform

app:
  # Declarative ops subscriptions (rule id → entry). Matching endpoints are
  # deduplicated on (channel, endpoint_key).
  subscriptions:
    demo-app-degraded:
      category: kontiki.registry
      event_type: instance_state_changed
      criteria:
        - key: new_state
          operator: eq
          value: degraded
      endpoints:
        - telegram.ops_alerts
        - email.oncall
    registry-exceptions:
      category: kontiki.registry
      event_type: exception_recorded
      endpoints:
        - telegram.ops_alerts
        - email.oncall
    fleet-service-missing:
      category: kontiki.registry
      event_type: expected_service_missing
      endpoints:
        - telegram.ops_alerts
        - email.oncall
    fleet-insufficient-instances:
      category: kontiki.registry
      event_type: insufficient_active_instances
      endpoints:
        - telegram.ops_alerts
        - email.oncall
