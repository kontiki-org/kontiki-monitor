kontiki:
  amqp:
    url: amqp://guest:guest@rabbitmq/
  registration:
    # Give the registry a moment to boot before services publish.
    delay: 3

logging:
  directory: /data
  handlers:
    file:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      maxBytes: 2097152
      backupCount: 2
  root:
    handlers: [file]
    level: INFO
